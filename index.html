<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ateliê de Miçangas - Criador de Pares de Brincos Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bead-canvas {
            image-rendering: pixelated;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #111827;
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4b5563;
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-4 md:p-8 flex flex-col items-center selection:bg-emerald-500 selection:text-gray-950">

    <!-- Container Principal / Header -->
    <div class="w-full max-w-5xl bg-gray-900 rounded-3xl shadow-2xl p-6 md:p-8 mb-8 border border-gray-800 backdrop-blur-md">
        <div class="flex flex-col items-center text-center mb-8">
            <span class="px-4 py-1.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs font-semibold tracking-wider uppercase mb-3">Ateliê Profissional</span>
            <h1 class="text-3xl md:text-4xl font-extrabold text-white tracking-tight mb-2">Gerador de Par de Brincos</h1>
            <p class="text-sm md:text-base text-gray-400 max-w-xl">Redução inteligente de cores, modo simétrico ou idêntico e contagem detalhada.</p>
        </div>

        <!-- Controles -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div class="space-y-2 lg:col-span-1">
                <label class="block text-xs font-bold uppercase tracking-wider text-emerald-400">1. Foto do Desenho</label>
                <input type="file" id="imageInput" accept="image/*" class="w-full text-xs text-gray-400 file:mr-2 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-emerald-500 file:text-gray-950 hover:file:bg-emerald-400 cursor-pointer bg-gray-950/60 border border-gray-700/80 rounded-2xl p-2 transition">
            </div>
            <div class="space-y-2">
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-400">Largura (un)</label>
                <input type="number" id="colsInput" value="15" min="5" max="40" class="w-full bg-gray-950/60 border border-gray-700/80 rounded-2xl px-4 py-2.5 text-white font-medium focus:outline-none focus:border-emerald-500 transition">
            </div>
            <div class="space-y-2">
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-400">Altura (Linhas)</label>
                <input type="number" id="rowsInput" value="25" min="5" max="80" class="w-full bg-gray-950/60 border border-gray-700/80 rounded-2xl px-4 py-2.5 text-white font-medium focus:outline-none focus:border-emerald-500 transition">
            </div>
            <div class="space-y-2">
                <label class="block text-xs font-bold uppercase tracking-wider text-emerald-400">Máx. Cores (IA)</label>
                <input type="number" id="maxColorsInput" value="10" min="2" max="30" class="w-full bg-gray-950/60 border-2 border-emerald-500/80 rounded-2xl px-4 py-2.5 text-white font-bold focus:outline-none focus:border-emerald-400 transition">
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
            <div class="md:col-span-1 space-y-2">
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-400">Modo de Geração</label>
                <select id="modeInput" class="w-full bg-gray-950/60 border border-gray-700/80 rounded-2xl px-4 py-3 text-white text-sm focus:outline-none focus:border-emerald-500 transition">
                    <option value="sym">Par Simétrico (Esquerdo + Direito Espelhado)</option>
                    <option value="single">Imagem Única (Lados Iguais)</option>
                </select>
            </div>
            <div class="md:col-span-2">
                <button onclick="processImage()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-gray-950 font-extrabold py-3.5 px-6 rounded-2xl transition-all duration-200 shadow-lg shadow-emerald-950/50 flex items-center justify-center gap-2 transform active:scale-[0.99]">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    Gerar Gráfico Inteligente
                </button>
            </div>
        </div>
    </div>

    <!-- Resultados Lado a Lado -->
    <div id="resultContainer" class="w-full max-w-5xl hidden flex flex-col gap-6">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Brinco Esquerdo -->
            <div class="bg-gray-900 rounded-3xl shadow-2xl p-6 border border-gray-800 flex flex-col items-center">
                <div class="w-full flex items-center justify-between mb-4 border-b border-gray-800 pb-3">
                    <h2 class="text-lg font-bold text-emerald-400">Brinco Esquerdo</h2>
                    <span class="text-[10px] bg-emerald-500/10 text-emerald-300 px-2.5 py-1 rounded-full border border-emerald-500/20 font-semibold uppercase tracking-wider">Painel Esq</span>
                </div>
                
                <div class="overflow-x-auto w-full flex justify-center mb-6 p-4 bg-gray-950/60 rounded-2xl border border-gray-800/80 shadow-inner">
                    <canvas id="canvasLeft" class="border border-gray-700/50 rounded-xl shadow-lg bg-white bead-canvas"></canvas>
                </div>

                <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400 w-full mb-3">Total de Cores Reduzidas</h3>
                <div id="summaryLeft" class="grid grid-cols-2 gap-2.5 w-full text-xs mb-6"></div>

                <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400 w-full mb-3">Linhas (Esq)</h3>
                <div id="rowsLeft" class="max-h-52 overflow-y-auto w-full space-y-2 text-xs text-gray-300 pr-1 bg-gray-950/40 p-3 rounded-2xl border border-gray-800"></div>
            </div>

            <!-- Brinco Direito -->
            <div class="bg-gray-900 rounded-3xl shadow-2xl p-6 border border-gray-800 flex flex-col items-center">
                <div class="w-full flex items-center justify-between mb-4 border-b border-gray-800 pb-3">
                    <h2 class="text-lg font-bold text-emerald-400">Brinco Direito</h2>
                    <span class="text-[10px] bg-teal-500/10 text-teal-300 px-2.5 py-1 rounded-full border border-teal-500/20 font-semibold uppercase tracking-wider">Painel Dir</span>
                </div>

                <div class="overflow-x-auto w-full flex justify-center mb-6 p-4 bg-gray-950/60 rounded-2xl border border-gray-800/80 shadow-inner">
                    <canvas id="canvasRight" class="border border-gray-700/50 rounded-xl shadow-lg bg-white bead-canvas"></canvas>
                </div>

                <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400 w-full mb-3">Total de Cores Reduzidas</h3>
                <div id="summaryRight" class="grid grid-cols-2 gap-2.5 w-full text-xs mb-6"></div>

                <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400 w-full mb-3">Linhas (Dir)</h3>
                <div id="rowsRight" class="max-h-52 overflow-y-auto w-full space-y-2 text-xs text-gray-300 pr-1 bg-gray-950/40 p-3 rounded-2xl border border-gray-800"></div>
            </div>
        </div>

    </div>

    <script>
        const pixelSize = 16;

        function processImage() {
            const fileInput = document.getElementById('imageInput');
            if (fileInput.files.length === 0) {
                alert('Por favor, selecione uma imagem primeiro.');
                return;
            }

            const cols = parseInt(document.getElementById('colsInput').value);
            const rows = parseInt(document.getElementById('rowsInput').value);
            const mode = document.getElementById('modeInput').value;
            const maxColors = parseInt(document.getElementById('maxColorsInput').value);

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    generateEarrings(img, cols, rows, mode, maxColors);
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(fileInput.files[0]);
        }

        function generateEarrings(img, cols, rows, mode, maxColors) {
            const canvasL = document.getElementById('canvasLeft');
            const canvasR = document.getElementById('canvasRight');
            const ctxL = canvasL.getContext('2d');
            const ctxR = canvasR.getContext('2d');

            canvasL.width = cols * pixelSize;
            canvasL.height = rows * pixelSize;
            canvasR.width = cols * pixelSize;
            canvasR.height = rows * pixelSize;

            // Canvas temporário com largura adequada ao modo
            const tempCanvas = document.createElement('canvas');
            const drawWidth = (mode === 'sym') ? cols * 2 : cols;
            tempCanvas.width = drawWidth;
            tempCanvas.height = rows;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.fillStyle = '#FFFFFF';
            tempCtx.fillRect(0, 0, drawWidth, rows);
            tempCtx.drawImage(img, 0, 0, drawWidth, rows);

            // Cria paleta reduzida baseada nas cores da imagem inteira
            const fullImageData = tempCtx.getImageData(0, 0, drawWidth, rows).data;
            const palette = generateColorPalette(fullImageData, maxColors);

            // Extrair dados da esquerda e direita
            const imgDataLeft = tempCtx.getImageData(0, 0, cols, rows);
            const imgDataRight = (mode === 'sym') ? tempCtx.getImageData(cols, 0, cols, rows) : imgDataLeft;

            // Processar Esquerdo
            const dataL = processSideWithPalette(ctxL, imgDataLeft, cols, rows, pixelSize, false, palette);
            displayData(dataL, 'summaryLeft', 'rowsLeft');

            // Processar Direito (espelhado se modo for 'sym')
            const mirrorRight = (mode === 'sym');
            const dataR = processSideWithPalette(ctxR, imgDataRight, cols, rows, pixelSize, mirrorRight, palette);
            displayData(dataR, 'summaryRight', 'rowsRight');

            document.getElementById('resultContainer').classList.remove('hidden');
        }

        // Algoritmo simples de agrupamento de cores (K-Means leve)
        function generateColorPalette(pixelData, maxColors) {
            let pixels = [];
            for (let i = 0; i < pixelData.length; i += 4) {
                if (pixelData[i + 3] > 128) {
                    pixels.push([pixelData[i], pixelData[i + 1], pixelData[i + 2]]);
                }
            }
            if (pixels.length === 0) return [[255, 255, 255]];

            let centroids = [];
            for (let i = 0; i < Math.min(maxColors, pixels.length); i++) {
                centroids.push(pixels[Math.floor(Math.random() * pixels.length)]);
            }

            for (let iter = 0; iter < 10; iter++) {
                let clusters = Array.from({ length: centroids.length }, () => []);
                for (let p of pixels) {
                    let minDist = Infinity;
                    let closest = 0;
                    for (let c = 0; c < centroids.length; c++) {
                        let dist = Math.abs(p[0] - centroids[c][0]) + Math.abs(p[1] - centroids[c][1]) + Math.abs(p[2] - centroids[c][2]);
                        if (dist < minDist) {
                            minDist = dist;
                            closest = c;
                        }
                    }
                    clusters[closest].push(p);
                }

                for (let c = 0; c < centroids.length; c++) {
                    if (clusters[c].length > 0) {
                        let sumR = 0, sumG = 0, sumB = 0;
                        for (let p of clusters[c]) {
                            sumR += p[0]; sumG += p[1]; sumB += p[2];
                        }
                        centroids[c] = [
                            Math.round(sumR / clusters[c].length),
                            Math.round(sumG / clusters[c].length),
                            Math.round(sumB / clusters[c].length)
                        ];
                    }
                }
            }
            return centroids;
        }

        function findClosestColorHex(r, g, b, palette) {
            let minDist = Infinity;
            let closestRGB = palette[0];
            for (let c of palette) {
                let dist = Math.abs(r - c[0]) + Math.abs(g - c[1]) + Math.abs(b - c[2]);
                if (dist < minDist) {
                    minDist = dist;
                    closestRGB = c;
                }
            }
            return rgbToHex(closestRGB[0], closestRGB[1], closestRGB[2]);
        }

        function processSideWithPalette(ctx, imgData, cols, rows, pixelSize, mirror, palette) {
            const data = imgData.data;
            ctx.clearRect(0, 0, cols * pixelSize, rows * pixelSize);

            const colorCounts = {};
            const rowDetails = [];

            for (let y = 0; y < rows; y++) {
                let currentRowColors = {};
                for (let x = 0; x < cols; x++) {
                    let targetX = mirror ? (cols - 1 - x) : x;
                    const index = (y * cols + targetX) * 4;

                    const r = data[index];
                    const g = data[index + 1];
                    const b = data[index + 2];
                    const a = data[index + 3];

                    let hex = '#FFFFFF';
                    if (a >= 128) {
                        hex = findClosestColorHex(r, g, b, palette);
                    }

                    // Desenha na tela real
                    ctx.fillStyle = hex;
                    ctx.fillRect(x * pixelSize, y * pixelSize, pixelSize, pixelSize);
                    
                    ctx.strokeStyle = '#e5e7eb';
                    ctx.lineWidth = 0.5;
                    ctx.strokeRect(x * pixelSize, y * pixelSize, pixelSize, pixelSize);

                    colorCounts[hex] = (colorCounts[hex] || 0) + 1;
                    currentRowColors[hex] = (currentRowColors[hex] || 0) + 1;
                }
                rowDetails.push(currentRowColors);
            }
            return { totals: colorCounts, rows: rowDetails };
        }

        function rgbToHex(r, g, b) {
            return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
        }

        function displayData(result, summaryId, rowsId) {
            const summaryDiv = document.getElementById(summaryId);
            summaryDiv.innerHTML = '';
            for (const [hex, count] of Object.entries(result.totals)) {
                summaryDiv.innerHTML += `
                    <div class="flex items-center gap-2 bg-gray-900 p-2 rounded-xl border border-gray-800 shadow-sm">
                        <span class="w-4 h-4 rounded-full border border-gray-700 inline-block shrink-0 shadow-inner" style="background-color: ${hex};"></span>
                        <span class="text-xs text-gray-300"><b>${count}</b> un</span>
                    </div>
                `;
            }

            const rowDiv = document.getElementById(rowsId);
            rowDiv.innerHTML = '';
            result.rows.forEach((rowColors, index) => {
                let detailsText = Object.entries(rowColors)
                    .map(([hex, count]) => `<span class="inline-flex items-center gap-1.5 mr-2.5 my-0.5"><span class="w-2.5 h-2.5 rounded-full inline-block border border-gray-700 shadow-sm" style="background-color: ${hex};"></span>${count}</span>`)
                    .join(' | ');
                
                rowDiv.innerHTML += `
                    <div class="bg-gray-900/90 p-2.5 rounded-xl border border-gray-800/80 shadow-sm">
                        <strong class="text-emerald-400 font-mono">L${index + 1}:</strong> ${detailsText}
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
